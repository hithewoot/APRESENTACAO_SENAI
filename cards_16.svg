<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">

  <style>
    .card { fill: #ffffff; stroke: #d9d9d9; stroke-width: 1.5; }
    .title { font: bold 18px Arial; fill: #1a1a1a; }
    .subtitle { font: 13px Arial; fill: #666; }
    .text { font: 12px Arial; fill: #333; }
    .team { font: 12px Arial; fill: #444; }
    .label { font: bold 12px Arial; fill: #005CA9; }
    .img-box { fill: #f4f6f8; stroke: #9bb8d3; stroke-dasharray: 6 4; }
  </style>

  <!-- CARD 1 -->
  <g transform="translate(20,20)">
    <rect class="card" width="360" height="380" rx="16"/>

    <rect class="img-box" x="20" y="20" width="320" height="160" rx="10"/>
    <text x="180" y="105" text-anchor="middle" class="subtitle">ESPAÇO PARA IMAGEM</text>

    <text x="20" y="215" class="subtitle">Produção Audiovisual</text>
    <text x="20" y="240" class="title">Videoaulas Profissionais</text>

    <text x="20" y="270" class="text">Desenvolvimento de videoaulas e materiais digitais.</text>

    <text x="20" y="305" class="label">Equipe</text>
    <text x="20" y="325" class="team">Roteiro • Captação • Edição</text>

    <rect x="20" y="345" width="140" height="26" rx="13" fill="#e6f4ea"/>
    <text x="40" y="363" class="subtitle" fill="#1b7f3b">Case de Sucesso</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(420,20)">
    <rect class="card" width="360" height="380" rx="16"/>

    <rect class="img-box" x="20" y="20" width="320" height="160" rx="10"/>
    <text x="180" y="105" text-anchor="middle" class="subtitle">ESPAÇO PARA IMAGEM</text>

    <text x="20" y="215" class="subtitle">Motion Design</text>
    <text x="20" y="240" class="title">Animações Educacionais</text>

    <text x="20" y="270" class="text">Criação de animações 2D e infográficos educativos.</text>

    <text x="20" y="305" class="label">Equipe</text>
    <text x="20" y="325" class="team">Roteiro • Ilustração • Animação</text>

    <rect x="20" y="345" width="140" height="26" rx="13" fill="#e6f4ea"/>
    <text x="40" y="363" class="subtitle" fill="#1b7f3b">Case de Sucesso</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(820,20)">
    <rect class="card" width="360" height="380" rx="16"/>

    <rect class="img-box" x="20" y="20" width="320" height="160" rx="10"/>
    <text x="180" y="105" text-anchor="middle" class="subtitle">ESPAÇO PARA IMAGEM</text>

    <text x="20" y="215" class="subtitle">Objetos de Aprendizagem</text>
    <text x="20" y="240" class="title">Conteúdos Interativos</text>

    <text x="20" y="270" class="text">Desenvolvimento de materiais interativos educacionais.</text>

    <text x="20" y="305" class="label">Equipe</text>
    <text x="20" y="325" class="team">Design • Programação • Revisão</text>

    <rect x="20" y="345" width="140" height="26" rx="13" fill="#e6f4ea"/>
    <text x="40" y="363" class="subtitle" fill="#1b7f3b">Case de Sucesso</text>
  </g>

</svg>
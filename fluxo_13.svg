<svg width="1000" height="180" viewBox="0 0 1000 130" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #ffffff; stroke: #154193; stroke-width: 2; rx: 12; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #154193; font-weight: bold; }
    .arrow { stroke: #ff4700; stroke-width: 3; marker-end: url(#arrowhead); }
  </style>

  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#ff4700" />
    </marker>
  </defs>

  <!-- Move todo o fluxo 80px para a direita -->
  <g transform="translate(80,0)">

    <!-- Boxes -->
    <rect x="-9" y="60" width="150" height="50" class="box"/>
    <text x="68" y="90" text-anchor="middle" class="text">Empresa demanda</text>

    <rect x="170" y="60" width="140" height="50" class="box"/>
    <text x="240" y="90" text-anchor="middle" class="text">Equipe investiga</text>

    <rect x="340" y="60" width="160" height="50" class="box"/>
    <text x="420" y="90" text-anchor="middle" class="text">Mentor provoca</text>

    <rect x="530" y="60" width="130" height="50" class="box"/>
    <text x="595" y="90" text-anchor="middle" class="text">Banca avalia</text>

    <rect x="690" y="60" width="160" height="50" class="box"/>
    <text x="770" y="90" text-anchor="middle" class="text">Escola aprende</text>

    <!-- Arrows -->
    <line x1="140" y1="85" x2="170" y2="85" class="arrow"/>
    <line x1="310" y1="85" x2="340" y2="85" class="arrow"/>
    <line x1="500" y1="85" x2="530" y2="85" class="arrow"/>
    <line x1="660" y1="85" x2="690" y2="85" class="arrow"/>

  </g>

</svg>